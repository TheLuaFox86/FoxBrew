<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <title>FoxBrew Secure Loader</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    main { max-width: 32rem; padding: 1.5rem; text-align: center; }
    #status { font-size: 1.2rem; }
    .hard-refresh-button { margin-top: 1rem; padding: 0.65rem 1rem; color: #fff; background: transparent; border: 1px solid #999; border-radius: 0.4rem; cursor: pointer; }
    .hard-refresh-button:disabled { opacity: 0.6; cursor: wait; }
    .hard-refresh-status { min-height: 1.5em; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <div id="status">Initializing Secure Environment...</div>
    <button class="hard-refresh-button" type="button">Not working? Click here to run a hard refresh</button>
    <p class="hard-refresh-status" role="status" aria-live="polite"></p>
  </main>

  <script src="hard-refresh.js"></script>
  <script type="module">
async function init() {
  if (!('serviceWorker' in navigator)) {
    document.getElementById('status').innerText = 'Service Workers not supported.';
    return;
  }

  try {
    // 1. Register the Service Worker
    const reg = await navigator.serviceWorker.register('sw.js');

    // Wait until the service worker is fully active and ready
    let worker = reg.active || reg.waiting || reg.installing;
    
    if (!navigator.serviceWorker.controller) {
      // If controller isn't claimed yet, wait for state changes
      await new Promise((resolve) => {
        if (reg.active) {
          resolve();
        } else {
          worker.addEventListener('statechange', (e) => {
            if (e.target.state === 'activated') resolve();
          });
        }
      });
    }

    const activeWorker = navigator.serviceWorker.controller || reg.active;
    if (!activeWorker) throw new Error('Service worker failed to become active.');

    const password = prompt('Enter decryption password:');
    if (!password) throw new Error('Password required.');

    document.getElementById('status').innerText = 'Unlocking application...';

    // 2. Send password via MessageChannel safely
    const result = await new Promise((resolve, reject) => {
      const messageChannel = new MessageChannel();
      messageChannel.port1.onmessage = (event) => resolve(event.data);
      messageChannel.port1.onmessageerror = () => reject(new Error('Could not read the service worker response.'));
      
      activeWorker.postMessage({ type: 'SET_PASSWORD', password }, [messageChannel.port2]);
    });

    if (!result.success) {
      throw new Error(result.error || 'The application could not be unlocked.');
    }

    // 3. Fetch and decrypt core.html
    const res = await fetch('core.html');
    if (!res.ok) throw new Error('Failed to load core application.');
    
    const htmlText = await res.text();
    document.open();
    document.write(htmlText);
    document.close();

  } catch (err) {
    console.error(err);
    document.getElementById('status').innerHTML = 'Access Denied: ' + err.message;
  }
}

init();
</script>
</body>
</html>
